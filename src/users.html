<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public API - Data Pengguna | Codelab Modul 2</title>
  <link href="./output.css" rel="stylesheet" />
</head>
<body class="bg-brand-bg text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <header class="bg-brand-primary text-white px-6 py-4 shadow-md sticky top-0 z-50">
    <nav class="max-w-7xl mx-auto flex justify-between items-center flex-wrap">
      <div class="flex items-center gap-3">
        <a href="./index.html" class="font-bold text-xl text-brand-accent tracking-wide hover:text-cyan-300 transition duration-200">
          MyWebsite
        </a>
      </div>

      <!-- Tombol Hamburger Mobile -->
      <button 
        id="navbar-toggle-users" 
        type="button" 
        class="md:hidden text-white hover:text-brand-accent focus:outline-none p-1 rounded transition duration-200"
        aria-label="Toggle Menu"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <!-- Menu Navigasi -->
      <ul id="nav-menu-users" class="hidden md:flex flex-col md:flex-row w-full md:w-auto mt-4 md:mt-0 gap-4 md:gap-6 font-medium text-sm md:text-base border-t md:border-none border-blue-800 pt-4 md:pt-0">
        <li><a href="./index.html" class="hover:text-brand-accent transition duration-200">Home</a></li>
        <li><a href="./index.html#about" class="hover:text-brand-accent transition duration-200">About</a></li>
        <li><a href="./index.html#cards" class="hover:text-brand-accent transition duration-200">Services</a></li>
        <li><a href="./index.html#contact" class="hover:text-brand-accent transition duration-200">Contact</a></li>
        <li><a href="./users.html" class="text-brand-accent font-bold border-b-2 border-brand-accent pb-0.5">Data API</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-10">
    
    <!-- HEADER SECTION -->
    <div class="text-center max-w-2xl mx-auto mb-8">
      <h2 class="text-2xl md:text-4xl font-bold text-brand-primary mb-3">
        Data Pengguna dari Public API
      </h2>
      <p class="text-gray-600 text-sm md:text-base leading-relaxed">
        Mengambil dan merender data secara asynchronous menggunakan Fetch API dengan method GET dari endpoint <code class="bg-gray-200 text-gray-800 px-1.5 py-0.5 rounded text-xs">https://jsonplaceholder.typicode.com/users</code>.
      </p>
    </div>

    <!-- SEARCH & FILTER TOOLBAR (Bab 9.1 Gambar 9.2) -->
    <div class="max-w-md mx-auto mb-8">
      <label for="search-input" class="sr-only">Cari Pengguna</label>
      <input 
        id="search-input" 
        type="text" 
        placeholder="Cari user (nama, username, email)..." 
        class="border border-gray-300 p-3 w-full rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-secondary transition duration-200 text-sm"
        autocomplete="off"
      />
    </div>

    <!-- PESAN LOADING STATE (Bab 9.1 & Bab 9.3) -->
    <div class="text-center my-4">
      <p id="loading-message" class="text-brand-secondary font-semibold text-sm hidden animate-pulse"></p>
    </div>

    <!-- PESAN ERROR STATE (Bab 9.3) -->
    <div class="text-center max-w-md mx-auto my-4">
      <p id="error-message" class="p-4 bg-red-50 text-red-700 border border-red-200 rounded-xl text-sm font-semibold hidden"></p>
      <button 
        id="retry-btn" 
        type="button" 
        class="mt-3 bg-brand-secondary hover:bg-brand-primary text-white text-xs font-semibold px-4 py-2 rounded-lg shadow transition duration-200 hidden"
      >
        Coba Lagi
      </button>
    </div>

    <!-- USER CARDS GRID (Bab 9.1 Gambar 9.2: id="user-list") -->
    <div id="user-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
      <!-- Data Card di-render secara dinamis menggunakan users.js -->
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-brand-primary text-white text-center py-4 text-sm mt-auto">
    <p>Copyright 2026 - Codelab Modul 2</p>
  </footer>

  <!-- Script Navbar Mobile pada users.html -->
  <script>
    const navToggleUsers = document.querySelector("#navbar-toggle-users");
    const navMenuUsers = document.querySelector("#nav-menu-users");
    if (navToggleUsers && navMenuUsers) {
      navToggleUsers.addEventListener("click", () => {
        navMenuUsers.classList.toggle("hidden");
      });
    }
  </script>

  <!-- Script Fetch API & Manipulasi DOM (Bab 9) -->
  <script src="./users.js" defer></script>
</body>
</html>
